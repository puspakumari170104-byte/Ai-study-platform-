name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Environment Configuration, Android SDK Platform & Keystore
        run: |
          # Ensure .env file exists for Secrets Gradle plugin
          touch .env
          
          # Auto-accept licenses and install compileSdk 36 platform & build tools
          yes | sdkmanager --licenses || true
          echo "y" | sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0" || true

          # Ensure debug.keystore exists
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyWithAI-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with Single APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Study With AI {0}', github.ref_name) || 'Study With AI - Latest Android APK' }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 Direct Android Phone Download (Single APK - No ZIP)

            Download the installable APK file directly to your Android phone without needing to extract any zip files:

            - 📥 **Single APK Download Link**: Tap **`app-debug.apk`** under the **Assets** section below.
            
            ### 🚀 Quick 3-Step Phone Installation:
            1. **Download**: Tap **`app-debug.apk`** below to start downloading.
            2. **Open**: Once the download completes, tap the file in your notification bar or **Downloads** folder.
            3. **Install**: Tap **Install**. If Android prompts with *"For your security, your phone is not allowed to install unknown apps from this source"*, tap **Settings** and turn on **"Allow from this source"**, then complete installation.
            
            ### ✨ Included Features:
            - 👨‍🏫 **Photorealistic AI Teachers**: World-class faculty (Physics, Chemistry, Math, Biology) with human demeanor, audio speech, and blackboard derivations.
            - 🎙️ **1-on-1 Socratic Doubt Room**: Voice microphone input & conversational Google Gemini flow.
            - 📝 **Live Digital Smart Board**: Real-time chalk formula rendering and step-by-step notes.
            - 🎯 **Daily Practice (DPP) & Mastery**: Concept questions with instant voice derivations.
            - 📓 **Mistake Notebook**: Intelligent error classification and revision.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
